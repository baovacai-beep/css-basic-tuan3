<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Khoa CNTTKD - Best Shared Hosting</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 50px 20px;
    }

    .best-shared {
      text-align: center;
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .best-shared .logo img {
      width: 220px;
      height: auto;
      margin-bottom: 20px;
    }

    .best-shared h2 {
      font-size: 28px;
      color: #1e293b;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .best-shared h2 strong {
      color: #0284c7;
      font-weight: 700;
    }

    .best-shared .lead-text {
      color: #64748b;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .btn-list li {
      display: inline-block;
      margin: 0 8px;
    }

    .btn-list li a {
      display: inline-block;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.25s ease;
    }

    .btn-list li:first-child a {
      background-color: #0284c7;
      color: #ffffff;
      border: 1px solid #0284c7;
    }

    .btn-list li:first-child a:hover {
      background-color: #0369a1;
    }

    .btn-list li:last-child a {
      background-color: transparent;
      color: #475569;
      border: 1px solid #cbd5e1;
    }

    .btn-list li:last-child a:hover {
      background-color: #f1f5f9;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <section class="best-shared">
    <p class="logo">
      <img src="https://bit.ueh.edu.vn/wp-content/uploads/2017/06/BIT_logo.png" alt="Logo BIT">
    </p>
    <h2>Best <strong>Shared Hosting</strong> Company</h2>
    <p class="lead-text">
      With this responsive landing page template, you can promote your all hosting, domain and email services.
    </p>
    <ul class="btn-list">
      <li><a href="./">View Plans</a></li>
      <li><a href="./">All Features</a></li>
    </ul>
  </section>
</body>
</html>
