<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Học web chuẩn - Portfolio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background-color: #ffffff;
    }

    .portfolio {
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }

    .portfolio h2 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: #222222;
    }

    .portfolio h2::after {
      content: "";
      display: block;
      width: 45px;
      height: 2px;
      background-color: #16a085;
      margin: 10px auto 25px;
    }

    /* Tab Filter */
    .list-tab {
      list-style: none;
      padding: 0;
      margin: 0 0 35px 0;
    }

    .list-tab li {
      display: inline-block;
      margin: 0 10px;
    }

    .list-tab li a {
      text-decoration: none;
      color: #555555;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .list-tab li:first-child a,
    .list-tab li a:hover {
      color: #16a085;
    }

    /* Gallery 3 cột */
    .galerry {
      list-style: none;
      padding: 0;
      margin: 0 -10px;
    }

    .galerry::after {
      content: "";
      display: block;
      clear: both; /* Clearfix */
    }

    .galerry li {
      display: inline-block;
      width: 31.5%;
      margin: 0 0.8% 20px;
      vertical-align: top;
      box-sizing: border-box;
    }

    .galerry li a {
      display: block;
      background-color: #93c06d; /* Màu xanh nền chữ Học Web Chuẩn */
      border-radius: 4px;
      overflow: hidden;
      aspect-ratio: 350 / 260;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .galerry li a:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }

    .galerry li img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <section class="portfolio">
    <h2>MY PORTFOLIO</h2>
    <ul class="list-tab">
      <li><a href="./">All</a></li>
      <li><a href="./">Web App</a></li>
      <li><a href="./">UI/UX</a></li>
      <li><a href="./">Graphics Design</a></li>
      <li><a href="./">Mobile App</a></li>
      <li><a href="./">Branding</a></li>
      <li><a href="./">Marketing</a></li>
    </ul>
    <ul class="galerry">
      <li><a href="./">Học Web Chuẩn</a></li>

      <li><a href="./">Học Web Chuẩn</a></li>
      <li><a href="./">Học Web Chuẩn</a></li>
      <li><a href="./">Học Web Chuẩn</a></li>
      <li><a href="./">Học Web Chuẩn</a></li>
      <li><a href="./">Học Web Chuẩn</a></li>
      <li><a href="./">Học Web Chuẩn</a></li>
      <li><a href="./">Học Web Chuẩn</a></li>
    </ul>
  </section>
</body>
</html>
